

cargo-features = ["profile-rustflags"]

[package]
name = "microscope"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Linux x86-64 native debugger"
repository = "https://github.com/microscope-dev/microscope"
readme = "README.md"



publish = false
keywords = ["debugger", "dwarf", "linux", "ptrace"]
categories = ["command-line-utilities", "development-tools::debugging"]

[features]

fuzzing = ["object/write"]


sim = []


system-alloc = []



bpf-walk-timing = []


self-probes = ["microscope-probes/enabled"]


tools = []





bpf-faults = []



ring-lease = []

[[bin]]
name = "microscope-tools"
path = "src/bin/microscope-tools.rs"
required-features = ["tools"]

[[bin]]
name = "microscope-sim"
path = "src/bin/microscope-sim.rs"
required-features = ["sim"]

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused = { level = "deny", priority = -1 }

unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }


iter_over_hash_type = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
anstyle-query = "1.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
memchr = "2.8"
regex = "1.13"
rustyline = "18.0"
rustc_apfloat = "=0.2.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
wasmi = { version = "2.0", default-features = false, features = ["std", "validate"] }
tokio = { version = "1.52", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
toml = "1.1"
mimalloc = { version = "0.1", default-features = false }
foldhash = "0.2"

flate2 = "1.1"


zerocopy = { version = "0.8", features = ["alloc", "derive"] }
rayon = "1.11"
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64", "xxhash3_128"] }


microscope-probes = { path = "sdk/rust-probes" }
getrandom = "0.3"
base64 = "0.22"
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
aya-obj = "0.3"

cpp_demangle = { git = "https://github.com/microscope-dev/cpp_demangle", rev = "3f6f357479cd8b7ffea785d8dace50e2bf974b5b" }
crc32fast = "1.5"
gimli = "0.34"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "gas", "instr_info", "intel", "std"] }
lzma-rs = "0.3"
nix = { version = "0.31", features = ["feature", "fs", "net", "personality", "poll", "ptrace", "process", "resource", "sched", "signal", "term", "time", "uio"] }


object = { version = "0.39", default-features = false, features = ["read", "std"] }


ruzstd = "0.9.1"
perf-event = "0.4"

rustix = { version = "1.1", features = ["event", "net", "param", "process", "thread"] }

tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustc-demangle = "0.1"

[dev-dependencies]
expectrl = "0.9"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
jsonschema = { version = "0.58", default-features = false }


proptest = { version = "1.11", default-features = false, features = ["fork", "std", "timeout"] }
proptest-state-machine = "0.6"
tokio-tungstenite = "0.29"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read", "std", "write"] }







[profile.test]
opt-level = 1
debug = 1
lto = "off"






[profile.dev]
rustflags = ["-C", "force-frame-pointers=yes"]

[profile.release]
overflow-checks = true
rustflags = ["-C", "force-frame-pointers=yes"]



[profile.profiling]
inherits = "release"
debug = "line-tables-only"



[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true




[profile.test.package.microscope]
debug = 0


codegen-units = 4096
