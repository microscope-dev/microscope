




[workspace]
resolver = "3"
members = ["truth", "std-async", "panics", "workers", "server", "drivers", "steps", "cancel", "shapes", "values", "runtimes", "scale", "blocking", "migrate", "deadlock", "corrupt", "profile"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
truth = { path = "truth" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0
debug = 2

[profile.release]
opt-level = 3
debug = 2


[profile.abort]
inherits = "dev"
panic = "abort"


[profile.lines]
inherits = "dev"
debug = "line-tables-only"


[profile.stripped]
inherits = "dev"
strip = "debuginfo"
