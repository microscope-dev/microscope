


[graph]


targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]


db-path = "target/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]


unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [

    { id = "RUSTSEC-2026-0441", reason = "only the tests build it, through expectrl 0.9's nix 0.26, and expectrl has no later release" },
]

[licenses]

allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",

    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",

    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

unused-allowed-license = "allow"


[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]


allow-git = ["https://github.com/microscope-dev/cpp_demangle"]

unused-allowed-source = "allow"
