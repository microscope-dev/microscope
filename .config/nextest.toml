nextest-version = "0.9.150"


[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }





[[profile.default.overrides]]
filter = 'binary(disassembly) | binary(symbols) | binary(frames) | binary(tokio)'
priority = 50


[profile.props]
slow-timeout = { period = "60s", terminate-after = 15 }


[profile.soak]
slow-timeout = { period = "60s", terminate-after = 1440 }



[test-groups]
bpf-profiles = { max-threads = 1 }





[[profile.default.overrides]]
filter = 'binary(profiler_kernel) | (test(/(^|::)bpf::/) & (binary(node) | (binary(python) & test(/^profile::/))))'
test-group = 'bpf-profiles'





[[profile.default.overrides]]
filter = '(binary(profiler) & test(=maximum_rate_keeps_at_least_99_percent_of_a_short_rust_burst)) | (binary(microscope) & test(/^backend::linux::perf::tests::a_reader_(that_falls_behind|far_behind)/)) | (binary(syscalls) & test(=bpf::a_burst_of_copied_stacks_loses_no_calls))'
threads-required = 'num-test-threads'
priority = 100





[test-groups.node-recordings]
max-threads = 2

[[profile.default.overrides]]
filter = 'binary(node) & test(/^(profile|syscalls|live)::|^debian::debian_live/)'
test-group = 'node-recordings'
priority = 90




[test-groups.bpf-recordings]
max-threads = 8

[[profile.default.overrides]]
filter = 'binary(syscalls) & test(/^bpf::/)'
test-group = 'bpf-recordings'




[test-groups.python-snapshots]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^profile::stopped_snapshots_find/)'
test-group = 'python-snapshots'
