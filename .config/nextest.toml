# A debugger test that hangs would otherwise block the run forever.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# These suites compare whole modules with binutils and gdb, and the tokio
# suite reads programs whose debug information takes a second each to load,
# so their tests run for seconds. Starting them first keeps them off the end
# of a run.
[[profile.default.overrides]]
filter = 'binary(disassembly) | binary(symbols) | binary(frames) | binary(tokio)'
priority = 50

# `just stress` with SOAK_MINUTES runs one test for as long as it is told to.
[profile.soak]
slow-timeout = { period = "60s", terminate-after = 1440 }

# The BPF engines' tests each map perf rings on every CPU, which count
# against this user's perf memory (kernel.perf_event_mlock_kb on each CPU,
# then RLIMIT_MEMLOCK): more than two at once can run out of it.
[test-groups]
perf-rings = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/(^|::)bpf::/)'
test-group = 'perf-rings'

# Node's profile and syscall tests record a program that spins two threads,
# or stop it again and again for snapshots, and their own reads of V8 take
# a CPU each: run together under `just stress`, they starve the debugger's
# Node tests past their deadlines. One at a time leaves those the CPUs.
[test-groups.node-recordings]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(node) & test(/^(profile|syscalls)::/)'
test-group = 'node-recordings'

# Each stopped snapshot's debugger reads every library's debug information
# again, which `just stress`, with no image cache, makes take seconds of
# every CPU: one recording at a time leaves the other tests the CPUs.
[test-groups.python-snapshots]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^profile::stopped_snapshots_find/)'
test-group = 'python-snapshots'
