[package]
name = "microscope-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unsafe_code = "deny"

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "rt"] }
microscope = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "expression-parse"
path = "fuzz_targets/expression_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dwarf-expression"
path = "fuzz_targets/dwarf_expression.rs"
test = false
doc = false
bench = false

